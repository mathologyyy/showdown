; gameplay_tweaks.cfg – zentrale, editierbare Gameplay-Werte für "showdown".
; Format: Godot ConfigFile. Kommentarzeilen beginnen mit ";".
; Fehlt ein Schlüssel, meldet das Autoload "Tweaks" das einmalig als Warnung
; und verwendet den Default aus dem Code.

[tempo]
; Tempo im Slowdown
slowdown_speed = 0.10
; Tempo des normalen Gameplays (1.0 = Echtzeit)
normal_speed = 1.0
; true: Slowdown nur, solange die Waffe angelegt ist (sonst normal_speed). false: immer Slowdown (altes Verhalten)
slowdown_only_while_aiming = false
; echte Sekunden für den weichen Übergang zwischen normalem Tempo und Slowdown
slowdown_blend_time = 0.15
; Tempo der Auswertung (Faktor der Echtzeit), bisher RESOLVE_TIME_SCALE
resolve_speed = 0.6
; Rückspulgeschwindigkeit: Vielfaches der Echtzeit, mit dem ein Zug zurückgespult wird
rewind_speed = 4.0
; Obergrenze in echten Sekunden: längere Züge werden entsprechend schneller zurückgespult
rewind_max_seconds = 3.0
; Untergrenze in echten Sekunden: kurze Züge werden entsprechend langsamer zurückgespult, damit man es sieht
rewind_min_seconds = 0.8

[player]
; Laufgeschwindigkeit (m pro Spielsekunde)
move_speed = 3.2
; Lauftempo geduckt (Faktor auf move_speed)
crouch_speed_factor = 0.7
; Lauftempo mit erhobenem Schild (Faktor auf move_speed)
shield_speed_factor = 0.55
; Lauftempo mit angelegter Waffe (Faktor auf move_speed)
aim_move_speed_factor = 1.0
; wie schnell die Waffe dem Mauszeiger folgt (1/s Spielzeit), bisher aim_follow
aim_turn_speed = 6.0
; Spielsekunden Stillstand bis volle Stabilität, bisher stabilize_time
aim_steady_time = 0.6
; Streuung direkt nach Bewegung (± Grad)
spread_max_deg = 7.0
; Streuung bei voller Stabilität (± Grad)
spread_min_deg = 0.4
; Magazingröße (Kugeln)
max_ammo = 12
; Blendgranaten pro Officer (Stück)
max_grenades = 2
; Hechtrolle: Tempo als Vielfaches von move_speed (2.0 = doppelt so schnell wie Laufen)
roll_speed_factor = 2.0
; Hechtrolle: Dauer (Spielsekunden)
roll_time = 0.42
; Hechtrolle: Cooldown bis zur nächsten Rolle (Spielsekunden)
roll_cooldown = 1.5
; Hechtrolle: danach so lange maximale Streuung (Spielsekunden)
roll_recover = 0.4

[enemy]
; Reaktionszeit: Spielsekunden von Sichtkontakt bis zum ersten Schuss
reaction_time = 0.7
; Spielsekunden zwischen zwei Schüssen
fire_cooldown = 1.0
; Ziel-Tempo: Drehgeschwindigkeit beim Anvisieren (Grad pro Spielsekunde)
aim_turn_speed_deg = 220.0
; Ziel-Genauigkeit: Streuung (± Grad), kleiner = genauer
aim_spread_deg = 2.0
; Sichtweite (m)
view_range = 10.0
; halber Sichtfeldwinkel (Grad)
fov_half_deg = 50.0
; Hörweite (m)
hearing_range = 3.0
; Patrouillengeschwindigkeit (m pro Spielsekunde)
patrol_speed = 0.6
; Tempo beim Ausweichen (m pro Spielsekunde)
run_speed = 2.6
; Wartezeit hinter der Deckung (Spielsekunden)
cover_wait = 1.0
; Cooldown, frühestens dann geht er erneut in Deckung (Spielsekunden)
cover_cooldown = 4.0
; Frist bis zur Erschießung der Geisel (Spielsekunden)
threat_time = 10.0
; Spielsekunden, bis die Waffe nach Sichtung/Geräusch im Anschlag ist
weapon_draw_time = 0.4

[weapons]
; Kugelgeschwindigkeit (m pro Spielsekunde)
bullet_speed = 40.0
; maximale Wurfweite der Blendgranate (m)
grenade_range = 8.0
; Fluggeschwindigkeit der Blendgranate (m pro Spielsekunde)
grenade_speed = 10.0
; Zündverzögerung nach dem ersten Aufkommen (Spielsekunden)
grenade_fuse = 0.6
; Blendradius (m)
flash_radius = 4.5
; Blenddauer (Spielsekunden)
flash_seconds = 2.5
; so oft prallt eine Kugel höchstens an Metall ab (Anzahl)
max_bounces = 2
